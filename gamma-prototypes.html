    const { useState, useLayoutEffect, useRef } = React;

    function makeIcon(name) {
      return function Icon({ className = "", strokeWidth = 2, style }) {
        const ref = useRef(null);
        useLayoutEffect(() => {
          const host = ref.current;
          if (!host || !window.lucide?.icons?.[name]) return;
          host.replaceChildren();
          const svg = lucide.createElement(lucide.icons[name]);
          svg.setAttribute("stroke-width", String(strokeWidth));
          svg.setAttribute("aria-hidden", "true");
          if (className) svg.setAttribute("class", className);
          host.appendChild(svg);
        }, [className, strokeWidth]);
        return <span ref={ref} className={"inline-flex items-center justify-center " + className} style={style} />;
      };
    }
